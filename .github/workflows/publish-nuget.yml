name: Release

on:
  workflow_dispatch:

permissions:
  contents: write   # to create and push the release tag
  id-token: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    needs: build
    if: github.actor == 'mircodz'
    environment: publish
    runs-on: ubuntu-latest
    env:
      OUT_DIR: artifacts/nupkg
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        run: echo "VERSION=$(cat version)" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        run: |
          if git rev-parse "${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.VERSION }} already exists. Bump the version file." >&2
            exit 1
          fi

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: sherlock-tools-nupkg
          path: ${{ env.OUT_DIR }}

      - name: Verify package
        run: |
          test -f "$OUT_DIR/sherlock-tools.${{ steps.version.outputs.VERSION }}.nupkg"
          dotnet tool install --tool-path artifacts/tool \
            --add-source "$OUT_DIR" \
            sherlock-tools \
            --version "${{ steps.version.outputs.VERSION }}"
          artifacts/tool/sl --help

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          server: https://api.nuget.org/v3/index.json
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "$OUT_DIR"/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "$OUT_DIR"/*.nupkg \
            --source "https://nuget.pkg.github.com/${OWNER}/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" "$OUT_DIR"/*.nupkg \
            --target "$GITHUB_SHA" \
            --title "Sherlock ${{ steps.version.outputs.VERSION }}" \
            --generate-notes
