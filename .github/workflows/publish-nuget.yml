name: Release

on:
  workflow_dispatch:

permissions:
  contents: write   # to push the release tag and create the GitHub release
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    name: check branch and version
    if: github.actor == 'mircodz'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Ensure main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are published from main; this run is on ${GITHUB_REF}." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < version)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$version'. Expected MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$version"; then
            echo "Tag $version already exists. Bump the version file." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish and tag
    needs: [check, build]
    environment: publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      OUT_DIR: artifacts/nupkg
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: sherlock-tools-nupkg
          path: ${{ env.OUT_DIR }}

      - name: Verify package
        run: |
          test -f "$OUT_DIR/sherlock-tools.$VERSION.nupkg"
          dotnet tool install --tool-path artifacts/tool \
            --add-source "$OUT_DIR" \
            sherlock-tools \
            --version "$VERSION"
          artifacts/tool/sl --help

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          server: https://api.nuget.org/v3/index.json
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "$OUT_DIR"/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "$OUT_DIR"/*.nupkg \
            --source "https://nuget.pkg.github.com/${OWNER}/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" "$OUT_DIR"/*.nupkg \
            --verify-tag \
            --title "Sherlock $VERSION" \
            --generate-notes
